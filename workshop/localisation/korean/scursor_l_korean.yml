 scursor.100.title:0 "Cursor size"
 scursor.100.desc:0 "Choose the size of your in-game cursor. §Y32 pixels§! is recommended. This does not change your Windows desktop pointer preferences.\n\nStart the companion §YCursorBridge companion§! first. Changes appear shortly after clicking; this window stays open for comparison.\n\nThis release supports single-player games only."
 scursor.size24:0 "24 pixels · Small"
 scursor.size32:0 "32 pixels · Recommended"
 scursor.size40:0 "40 pixels · Large"
 scursor.size48:0 "48 pixels · Extra large"
 scursor.restore:0 "Restore the original game cursor"
 scursor.close:0 "Done"
 edict_scursor_settings:0 "Cursor size settings"
 edict_scursor_settings_desc:0 "Open cursor size settings. Requires the companion CursorBridge companion. Costs no resources."
 scursor.101.title:0 "Cursor Size Settings"
 scursor.101.desc:0 "Open the live slider to choose any whole-pixel size from §Y1–96 pixels§!. Changes apply while dragging and remain after closing the panel. Restore the original game cursor at any time.\n\nRequires the §YCursorBridge companion§!. The slider is a floating companion panel. This release is for single-player games and keeps Windows desktop cursor preferences unchanged."
 scursor.open_slider:0 "Open live slider (1–96 pixels)"
 scursor.quick_sizes:0 "Use four quick sizes"
 scursor.native_settings:0 "Cursor size"
 scursor.native_settings_tip:0 "Open cursor size settings in a single-player game."
