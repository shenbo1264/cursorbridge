l_simp_chinese:
 scursor.100.title:0 "鼠标大小"
 scursor.100.desc:0 "选择游戏内光标的尺寸。推荐使用§Y32 像素§!；调整不会改变 Windows 桌面鼠标的偏好。\n\n请先启动配套的§YCursorBridge 配套程序§!，点击后稍候即可看到变化。窗口保持打开，方便比较各档尺寸。\n\n目前仅支持单人游戏。"
 scursor.size24:0 "24 像素 · 更小"
 scursor.size32:0 "32 像素 · 推荐"
 scursor.size40:0 "40 像素 · 较大"
 scursor.size48:0 "48 像素 · 大号"
 scursor.restore:0 "恢复游戏原光标"
 scursor.close:0 "完成调整"
 edict_scursor_settings:0 "鼠标大小设置"
 edict_scursor_settings_desc:0 "打开光标尺寸设置窗口。需要运行配套的CursorBridge 配套程序，不消耗资源。"
 scursor.101.title:0 "光标大小设置"
 scursor.101.desc:0 "打开实时滑块，选择 §Y1–96 像素§!的任意整数尺寸。拖动时立即生效，关闭面板后保留选择，也可随时恢复游戏原光标。\n\n需要运行配套的§YCursorBridge 配套程序§!。滑块是工具提供的浮动面板；目前仅支持单人游戏，不改变 Windows 桌面鼠标。"
 scursor.open_slider:0 "打开实时滑块（1–96 像素）"
 scursor.quick_sizes:0 "使用四档快捷尺寸"
 scursor.native_settings:0 "光标大小"
 scursor.native_settings_tip:0 "在单人游戏中打开光标大小设置。"
